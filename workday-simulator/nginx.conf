server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Route deep links to the same SPA with hash fragments
    location /ess/personal-data {
        rewrite ^ /index.html?page=ess break;
    }

    location /hr-service-center/complex-changes {
        rewrite ^ /index.html?page=complex break;
    }

    location /erlr/intake {
        rewrite ^ /index.html?page=erlr break;
    }

    location /goos/request {
        rewrite ^ /index.html?page=goos break;
    }
}
